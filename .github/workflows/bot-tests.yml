name: Тесты бота

on:
  push:
    paths:
      - 'bot/**'
      - '.github/workflows/bot-tests.yml'
  pull_request:
    paths:
      - 'bot/**'
      - '.github/workflows/bot-tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - run: pip install -r requirements.txt

      # Каждому набору нужен свой пустой DATA_DIR: тесты сверяют счётчики квот и статусы ключей,
      # на базе от предыдущего прогона цифры не сойдутся.
      - name: Прогон наборов
        env:
          BOT_TOKEN: '1:x'
          OWNER_ID: '1'
          AI_API_KEY: 'sk-test'
        run: |
          for suite in harness test_services test_trustat test_ai test_growth; do
            echo "::group::$suite"
            DATA_DIR="$RUNNER_TEMP/$suite" python -m "tests.$suite"
            echo "::endgroup::"
          done
